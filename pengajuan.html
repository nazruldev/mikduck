  <body data-page="pengajuan">
    <a class="skip" href="#main" data-i18n="common.skip">Lewati ke konten</a>

    <div data-site-chrome></div>

    <main id="main">
      <div class="page-hero">
        <div class="wrap">
          <p class="eyebrow" data-i18n="pengajuan.eyebrow">Komunitas</p>
          <h1 data-i18n="pengajuan.title">Pengajuan</h1>
          <p data-i18n="pengajuan.lead">
            Usulkan fitur, laporkan bug, atau minta perbaikan alur. Form membuka draft issue GitHub agar mudah dilacak.
          </p>
        </div>
      </div>

      <section class="section" id="form">
        <div class="wrap">
          <form class="form reveal" data-pengajuan-form>
            <div class="field">
              <label for="jenis" data-i18n="pengajuan.jenis">Jenis</label>
              <select id="jenis" name="jenis" required>
                <option value="Fitur" data-i18n="pengajuan.optFitur">Permintaan fitur</option>
                <option value="Bug" data-i18n="pengajuan.optBug">Laporan bug</option>
                <option value="Template" data-i18n="pengajuan.optTemplate">Template voucher / login</option>
                <option value="Dokumentasi" data-i18n="pengajuan.optDocs">Dokumentasi</option>
                <option value="Lainnya" data-i18n="pengajuan.optOther">Lainnya</option>
              </select>
            </div>
            <div class="field">
              <label for="judul" data-i18n="pengajuan.judul">Judul singkat</label>
              <input
                id="judul"
                name="judul"
                type="text"
                maxlength="120"
                required
                data-i18n-placeholder="pengajuan.judulPh"
                placeholder="Contoh: Export laporan finance ke CSV"
              />
            </div>
            <div class="field">
              <label for="detail" data-i18n="pengajuan.detail">Detail</label>
              <textarea
                id="detail"
                name="detail"
                required
                data-i18n-placeholder="pengajuan.detailPh"
                placeholder="Jelaskan kebutuhan, langkah reproduksi (untuk bug), atau contoh yang diharapkan."
              ></textarea>
            </div>
            <div class="field">
              <label for="kontak" data-i18n="pengajuan.kontak">Kontak (opsional)</label>
              <input
                id="kontak"
                name="kontak"
                type="text"
                maxlength="120"
                data-i18n-placeholder="pengajuan.kontakPh"
                placeholder="Telegram / email"
              />
            </div>
            <p class="form-hint" data-i18n="pengajuan.hint">Kirim akan membuka GitHub Issues dengan judul &amp; isi yang sudah terisi.</p>
            <div class="form-ok" data-form-ok data-i18n="pengajuan.ok">Draft issue dibuka di tab baru. Lanjutkan submit di GitHub.</div>
            <button class="btn btn-primary" type="submit" data-i18n="pengajuan.submit">Buat pengajuan</button>
          </form>
        </div>
      </section>
    </main>

    <div data-site-footer></div>
