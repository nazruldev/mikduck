  <body class="demo-body" data-page="demo">
    <div class="demo-banner">
      <a class="brand" href="./index.html">
        <img class="brand-logo-img" id="banner-logo" src="./brand/logo-horizontal-light.svg" alt="mikduck" height="22" />
      </a>
      <div class="demo-banner-meta">
        <span class="live-pill"><span class="live-dot"></span> <span data-i18n="nav.demo">Live demo</span></span>
        <span class="demo-hint" data-i18n="demo.hint">Data fiktif · tanpa router</span>
      </div>
      <div class="demo-banner-actions">
        <a class="demo-btn demo-btn-ghost" href="./index.html" data-i18n="demo.back">Kembali</a>
        <a class="demo-btn demo-btn-primary" href="./download.html" data-i18n="demo.download">Unduh app</a>
      </div>
    </div>

    <div class="demo-app" id="demo-app">
      <header class="demo-header">
        <button type="button" class="demo-menu-btn" id="demo-menu-btn" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <a class="demo-brand-mark" href="./index.html">
          <img id="app-logo" src="./brand/logo-horizontal-light.svg" alt="mikduck" height="26" />
        </a>
        <div class="demo-header-right">
          <div class="pref-group" role="group" data-i18n-aria="common.lang" aria-label="Bahasa">
            <button type="button" class="pref-btn" data-set-lang="id" aria-pressed="false">ID</button>
            <button type="button" class="pref-btn" data-set-lang="en" aria-pressed="false">EN</button>
          </div>
          <div class="pref-group" role="group" aria-label="Tema">
            <button type="button" class="pref-btn" data-set-theme="light" aria-pressed="false">Light</button>
            <button type="button" class="pref-btn" data-set-theme="dark" aria-pressed="true">Dark</button>
          </div>
          <span class="demo-status">
            <span class="demo-status-dot"></span>
            <span data-i18n="demo.connected">Terhubung</span>
          </span>
          <button type="button" class="demo-btn demo-btn-sm" disabled title="Demo only">Logout</button>
        </div>
      </header>

      <button type="button" class="demo-backdrop" id="demo-backdrop" aria-label="Close menu"></button>

      <aside class="demo-aside" id="demo-aside" data-i18n-aria="demo.navLabel" aria-label="Navigasi demo">
        <div class="demo-router-card">
          <strong id="router-name">WiFi-Demo-Cafe</strong>
          <span>192.168.88.1</span>
        </div>
        <nav class="demo-nav" id="demo-nav">
          <!-- filled by demo.js -->
        </nav>
      </aside>

      <main class="demo-main" id="demo-main">
        <!-- panels filled by demo.js -->
      </main>
